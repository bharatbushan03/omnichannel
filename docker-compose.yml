version: "3.8"

services:
  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.24
    ports:
      - "7474:7474"  # browser UI
      - "7687:7687"  # bolt
    environment:
      - NEO4J_AUTH=neo4j/localdevpassword
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=knowledge_agent
      - POSTGRES_USER=agent
      - POSTGRES_PASSWORD=localdevpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schemas/postgres_acl_schema.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  qdrant_data:
  neo4j_data:
  postgres_data:
